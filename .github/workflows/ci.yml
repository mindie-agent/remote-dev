name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        env:
          HOME: ${{ runner.temp }}/rdev-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          MINDIE_CONFIG_HOME: ${{ runner.temp }}/mindie-config
          MINDIE_DATA_HOME: ${{ runner.temp }}/mindie-data
          MINDIE_DIAGNOSTICS_ROOT: ${{ runner.temp }}/mindie-diag
          REMOTE_DEV_AUTH_DIR: ${{ runner.temp }}/rdev-auth
          REMOTE_DEV_STATE_DIR: ${{ runner.temp }}/rdev-state
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$MINDIE_CONFIG_HOME" "$MINDIE_DATA_HOME" "$MINDIE_DIAGNOSTICS_ROOT" "$REMOTE_DEV_AUTH_DIR" "$REMOTE_DEV_STATE_DIR"
          python -m pytest -m "not live_npu" --durations=20 --junitxml=contracts.xml
      - name: Publish failing test details
        if: failure()
        run: python tests/ci_failure_summary.py contracts.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-${{ matrix.os }}-${{ matrix.python }}
          path: contracts.xml
          retention-days: 7

  client-portability:
    name: Client portability (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: All portable client contracts
        env:
          HOME: ${{ runner.temp }}/rdev-home
          USERPROFILE: ${{ runner.temp }}/rdev-home
          MINDIE_CONFIG_HOME: ${{ runner.temp }}/mindie-config
          MINDIE_DATA_HOME: ${{ runner.temp }}/mindie-data
          MINDIE_DIAGNOSTICS_ROOT: ${{ runner.temp }}/mindie-diag
          REMOTE_DEV_AUTH_DIR: ${{ runner.temp }}/rdev-auth
          REMOTE_DEV_STATE_DIR: ${{ runner.temp }}/rdev-state
        run: python -m pytest -q tests -m "not live_npu" --durations=20 --junitxml=client-portability.xml
      - name: Publish failing test details
        if: failure()
        run: python tests/ci_failure_summary.py client-portability.xml
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-portability-${{ matrix.os }}-${{ matrix.python }}
          path: client-portability.xml
          retention-days: 7

  wheel:
    name: Out-of-tree Wheel Smoke (P14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Build wheel, install in blank out-of-tree venv, verify CLI, workers, and MCP initialize
        run: |
          set -euo pipefail
          unset PYTHONPATH
          uv build
          wheel="$(realpath dist/*.whl)"
          clean="$(mktemp -d)"
          cd "$clean"
          python -m venv "$clean/venv"
          "$clean/venv/bin/python" -m pip install "$wheel"
          "$clean/venv/bin/python" -c "import pathlib, remote_dev; p=pathlib.Path(remote_dev.__file__).resolve(); assert 'site-packages' in p.parts, p; print(remote_dev.__version__)"
          "$clean/venv/bin/python" -c "from remote_dev.processes import control, worker_source; src=worker_source(); assert callable(control); assert 'PR_SET_CHILD_SUBREAPER' in src; assert 'REMOTE_DEV_JOB_TOKEN' in src; assert 'MINDIE_REMOTE_JOB' not in src"
          "$clean/venv/bin/remote-dev" --help
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n' | "$clean/venv/bin/python" -m remote_dev.mcp.server | grep -q '"protocolVersion"'

  real-ssh:
    name: OpenSSH loopback and durable jobs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and OpenSSH
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server
          python -m pip install -e ".[test]"
      - name: Real SSH receipts, binary transfer, and process lifetime
        env:
          REMOTE_DEV_REAL_SSH: '1'
        run: python -m pytest -q tests/test_real_ssh.py --junitxml=real-ssh.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-ssh-results
          path: real-ssh.xml

  release-ready:
    name: release-ready
    needs: [contracts, client-portability, wheel, real-ssh]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: python -c 'import json,os; assert all(job["result"] == "success" for job in json.loads(os.environ["RESULTS"]).values()), "required CI failed or was skipped"'
