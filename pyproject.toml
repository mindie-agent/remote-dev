[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaws-remote-dev"
version = "0.9.3"
description = "Remote development substrate: SSH-backed twins of local agent tools"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Qi Mao" }]
dependencies = [
  "vaws-diagnostics @ git+https://github.com/vllm-ascend-workspace/vaws-diagnostics@96fcdfaa0f25fa59f12e948eb4e17ead775f3287",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
test = ["pytest", "mcp==1.30.0"]

[project.scripts]
remote-dev = "remote_dev.cli:main"

[project.urls]
Homepage = "https://github.com/vllm-ascend-workspace/remote-dev"
Repository = "https://github.com/vllm-ascend-workspace/remote-dev"

[tool.hatch.build.targets.sdist]
include = [
  "/remote_dev",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/DESIGN.md",
  "/CLIENT_COMPATIBILITY.md",
  "/VALIDATION.md",
]

[tool.hatch.build.targets.wheel]
packages = ["remote_dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.force-include]
"remote_dev/schemas/artifact.schema.json" = "remote_dev/schemas/artifact.schema.json"
"remote_dev/schemas/bash.schema.json" = "remote_dev/schemas/bash.schema.json"
"remote_dev/schemas/edit.schema.json" = "remote_dev/schemas/edit.schema.json"
"remote_dev/schemas/endpoint.schema.json" = "remote_dev/schemas/endpoint.schema.json"
"remote_dev/schemas/patch.schema.json" = "remote_dev/schemas/patch.schema.json"
"remote_dev/schemas/read.schema.json" = "remote_dev/schemas/read.schema.json"
"remote_dev/schemas/result.schema.json" = "remote_dev/schemas/result.schema.json"
"remote_dev/processes/worker.py" = "remote_dev/processes/worker.py"
"remote_dev/processes/client.py" = "remote_dev/processes/client.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
