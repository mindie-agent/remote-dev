# Codex project configuration for the remote-dev MCP server.
# Copy to <project>/.codex/config.toml. Interactive MCP confirmation must
# remain available; headless runs need explicit, invocation-scoped approvals
# for the exact tools they will use.
approval_policy = "on-request"

[mcp_servers.remote_dev]
command = "uvx"
args = ["--from", "git+https://github.com/mindie-agent/remote-dev@main", "remote-dev", "server"]
startup_timeout_sec = 20
tool_timeout_sec = 600
enabled = true

[mcp_servers.remote_dev.env]
REMOTE_DEV_DEFAULT_USER = "root"
REMOTE_DEV_DEFAULT_ROOT = "/"
REMOTE_DEV_DEFAULT_CWD = "/"
# Optional consumer wiring; see README "Resolver plugin interface".
# REMOTE_DEV_RESOLVERS = "/absolute/path/to/consumer/remote_dev_plugin.py:setup"
# REMOTE_DEV_STATE_DIR = "/absolute/path/to/consumer/.remote-dev-state"
# REMOTE_DEV_RUNTIME_ENV_FILE = "/etc/profile.d/example-toolchain.sh"

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$|^apply_patch$|^mcp__(remote-dev|remote_dev)__.*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 -m remote_dev.hooks.codex_remote_guard'
timeout = 30
statusMessage = "Checking remote development policy"
